<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Conversor CUP · MXN · USDT</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header><h1>Conversor</h1><p class="sub">CUP · MXN · USDT</p></header>

  <section class="card">
    <div class="card-head">
      <h2>Tasas de conversión</h2>
      <button id="reset" class="btn ghost small" type="button">Restablecer tasas</button>
    </div>
    <label class="field"><span>CUP</span>
      <input id="cup" type="text" inputmode="decimal" autocomplete="off"><small class="err" id="err-cup"></small></label>
    <label class="field"><span>MXN</span>
      <input id="mxn" type="text" inputmode="decimal" autocomplete="off"><small class="err" id="err-mxn"></small></label>
  </section>

  <section class="res">
    <div><div class="lab">pmxn · CUP ÷ MXN</div><div class="val" id="out-pmxn">—</div></div>
    <button class="copy" type="button" aria-label="Copiar pmxn" data-copy="pmxn"></button>
  </section>

  <section class="card">
    <h2>Precios</h2>
    <label class="field"><span>pCUP · precio del peso cubano</span>
      <input id="pCupIn" type="text" inputmode="decimal" autocomplete="off"><small class="err" id="err-pCupIn"></small></label>
    <label class="field"><span>USDT · MXN por 1 USDT</span>
      <input id="usdt" type="text" inputmode="decimal" autocomplete="off"><small class="err" id="err-usdt"></small></label>
  </section>

  <section class="res">
    <div><div class="lab">pCUP · pCUP ÷ USDT</div><div class="val" id="out-pCup">—</div></div>
    <button class="copy" type="button" aria-label="Copiar pCUP" data-copy="pCup"></button>
  </section>

  <section class="card">
    <h2>Cantidad en MXN</h2>
    <div class="amount-row">
      <input id="amountMxn" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Cantidad en MXN">
      <span class="cur-tag">MXN</span>
    </div>
    <small class="err" id="err-amountMxn"></small>
    <button id="clear" class="btn ghost" type="button">Limpiar</button>
  </section>

  <section class="res">
    <div><div class="lab">pUSDT · Cantidad MXN ÷ USDT</div><div class="val" id="out-pUsdt">—</div></div>
    <button class="copy" type="button" aria-label="Copiar pUSDT" data-copy="pUsdt"></button>
  </section>

  <div class="toast" id="toast">Copiado</div>
</main>
<script src="converter.js"></script>
<script src="app.js"></script>
</body>
</html>
